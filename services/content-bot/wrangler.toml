# Worker: tanta-content-bot = the chat app (public/) + its API + the AI worker. Workers FREE plan.
name = "tanta-content-bot"
main = "src/index.js"
compatibility_date = "2026-10-01"

# The app files. /api/* always goes to the Worker; everything else is a static file.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Non-secret settings. Secrets: ANTHROPIC_API_KEY, GITHUB_TOKEN, ADMIN_KEY, VAPID_PRIVATE_JWK (see docs/SETUP.md).
[vars]
GITHUB_REPO = "dev-ahmedmahmoud/fast-shipping-sites"
LIVE_BRANCH = "claude/islamic-website-design-systems-wfyy85"
CLIENT_DIR = "clients/tantasportsclubelections"
SITE_URL = "https://husseindawoudlist.com"
# Cloudflare Pages branch preview. Branch content/<id> becomes content-<id> (lowercase).
PREVIEW_URL_TEMPLATE = "https://content-{id}.site-tantasportsclubelections.pages.dev"
ANTHROPIC_MODEL = "claude-sonnet-5-5"
VAPID_SUBJECT = "https://husseindawoudlist.com"
# Set to "off" to stop new messages and approvals (kill switch).
BOT_MODE = "on"

[triggers]
crons = ["17 * * * *"]   # hourly: drop changes older than 24 hours, fix stuck ones

# Queue: the API saves the message and drops a job here; the consumer runs the AI (no 30-second limit).
[[queues.producers]]
queue = "tanta-content-bot-inbox"
binding = "INBOX"

[[queues.consumers]]
queue = "tanta-content-bot-inbox"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 1

[[d1_databases]]
binding = "DB"
database_name = "tanta-content-bot"
database_id = "REPLACE_AFTER_D1_CREATE"
migrations_dir = "migrations"
