<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>إدارة تطبيق التعديل</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/admin.js" defer></script>
</head>
<body>
  <header class="bar"><img src="/icon-192.png" alt="" width="32" height="32"><div class="bar-text"><strong>إدارة تطبيق التعديل</strong><span>لأحمد فقط</span></div></header>
  <div class="admin scroll">
    <section id="login">
      <h2>مفتاح الإدارة</h2>
      <div class="row"><input id="key" type="password" autocomplete="off" placeholder="المفتاح" class="grow"><button id="go">دخول</button></div>
    </section>
    <div id="panel" hidden>
      <section>
        <h2>إضافة شخص</h2>
        <div class="row">
          <input id="name" placeholder="الاسم" maxlength="60" class="grow">
          <select id="role"><option value="cabinet">عضو بالحملة</option><option value="client">المرشح (صاحب الموافقة)</option></select>
          <button id="add">إضافة</button>
        </div>
      </section>
      <section>
        <h2>الأشخاص</h2>
        <div id="link" hidden></div>
        <div id="people"></div>
      </section>
      <section>
        <h2>سجل العمليات</h2>
        <ol id="audit" class="audit plain"></ol>
      </section>
    </div>
  </div>
  <div id="toast" role="status" hidden></div>
</body>
</html>
