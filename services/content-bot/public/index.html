<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e2a4e">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="تعديل الموقع">
  <title>تعديل نصوص الموقع</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="bar">
    <img src="/icon-192.png" alt="" width="32" height="32">
    <div class="bar-text"><strong>تعديل نصوص الموقع</strong><span id="who"></span></div>
    <button id="alerts" class="ghost" hidden>تفعيل الإشعارات</button>
  </header>

  <main id="locked" class="screen" hidden>
    <div class="panel">
      <h1>تطبيق خاص</h1>
      <p id="locked-msg">هذا التطبيق بدعوة فقط. اطلب رابط الدخول من أحمد ثم افتحه على هاتفك.</p>
    </div>
  </main>

  <main id="chat" class="screen" hidden>
    <div id="hint" class="hint" hidden></div>
    <ol id="list" aria-live="polite"></ol>
    <div id="typing" class="bubble bot typing" hidden>جارٍ العمل على طلبك…</div>
  </main>

  <form id="composer" hidden>
    <textarea id="text" rows="1" maxlength="1500" placeholder="اكتب طلبك…" aria-label="رسالتك"></textarea>
    <button id="send" type="submit">إرسال</button>
  </form>

  <div id="toast" role="status" hidden></div>
</body>
</html>
