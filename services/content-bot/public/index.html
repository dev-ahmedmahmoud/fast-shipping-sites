<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e2a4e">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="تعديل الموقع">
  <title>تعديل نصوص الموقع</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="bar">
    <img src="/icon-192.png" alt="" width="32" height="32">
    <div class="bar-text"><strong>تعديل نصوص الموقع</strong><span id="who"></span></div>
    <button id="alerts" class="ghost" hidden>تفعيل الإشعارات</button>
  </header>

  <main id="locked" class="screen" hidden>
    <div class="panel">
      <h1>تطبيق خاص</h1>
      <p id="locked-msg">هذا التطبيق بدعوة فقط. اطلب رابط الدخول من أحمد ثم افتحه على هاتفك.</p>
    </div>
  </main>

  <main id="app" class="screen" hidden>
    <div id="hint" class="hint" hidden></div>
    <form id="composer" class="ask">
      <label for="text">ما التعديل المطلوب على نصوص الموقع؟</label>
      <textarea id="text" rows="3" maxlength="1500" placeholder="مثال: غيّر نص الفوتر في الصفحة الرئيسية إلى …"></textarea>
      <button id="send" type="submit">إرسال الطلب</button>
      <p class="small">نصوص فقط، بدون تصميم. يُنشر التعديل على الموقع مباشرة بعد الفحص.</p>
    </form>
    <ol id="list" class="plain reqs" aria-live="polite"></ol>
  </main>

  <div id="toast" role="status" hidden></div>
</body>
</html>
